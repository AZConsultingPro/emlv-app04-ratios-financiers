      state=JSON.parse(JSON.stringify(d));state.practice||={};state.cases||={};state.quiz||={};state.points||={};state.completedActivities||={};save();render('h1');main.querySelector('#carnet-status').textContent='Carnet importé. Identité, réponses et progression sont restaurées.';
    }catch(err){status.textContent='Import impossible : '+err.message+' Votre carnet actuel est conservé.';}

  function validateImportedState(d){
    const record=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
    const check=(ok,message)=>{if(!ok)throw Error(message);};
    check(record(d.identity)&&['prenom','nom','promotion'].every(k=>typeof d.identity[k]==='string'),'L’identité est invalide.');
    for(const k of ['prenom','nom','promotion','studentId','email'])check(d.identity[k]===undefined||typeof d.identity[k]==='string'&&d.identity[k].length<=254,'Un champ d’identité est invalide.');
    check(record(d.accompagne),'La progression est invalide.');
    const answerState=s=>{check(record(s),'Une réponse est invalide.');for(const k of ['value','notice','message'])check(s[k]===undefined||typeof s[k]==='string'&&s[k].length<=10000,'Un texte de réponse est invalide.');for(const k of ['checked','ok','mastered','correct'])check(s[k]===undefined||typeof s[k]==='boolean','Un statut de réponse est invalide.');for(const k of ['tries','hints','wrong','choiceWrong'])check(s[k]===undefined||Number.isSafeInteger(s[k])&&s[k]>=0,'Un compteur est invalide.');for(const k of ['answer','selected'])check(s[k]===undefined||Array.isArray(s[k])&&s[k].length<=4&&s[k].every(i=>Number.isInteger(i)&&i>=0&&i<=3),'Une sélection est invalide.');};
    for(const [id,s]of Object.entries(d.accompagne)){check(!!itemById(id),'Une notion du carnet est inconnue.');answerState(s);}
    for(const k of ['practice','cases','quiz','points','completedActivities','approfondissements','devoir'])check(d[k]===undefined||record(d[k]),'Une rubrique du carnet est invalide.');
    for(const [id,s]of Object.entries(d.approfondissements||{})){check(cases.some(c=>c.id===id),'Un exercice est inconnu.');answerState(s);check(['choice','answer'].includes(s.stage),'L’étape de l’exercice est invalide.');check(typeof s.choice==='string'&&(!s.choice||!!catalogue[s.choice]),'L’indicateur choisi est invalide.');answerState(s.transfer);for(const k of ['why','interpret','feasible'])check(s[k]===undefined||typeof s[k]==='string','Le raisonnement est invalide.');}
    const dstd=d.devoir||{};check(dstd.answers===undefined||record(dstd.answers),'Les réponses au devoir sont invalides.');
    for(const [id,s]of Object.entries(dstd.answers||{})){check(dstQuestions.some(q=>q.id===id),'Une question du devoir est inconnue.');answerState(s);}
    check(d.returnRoute===undefined||typeof d.returnRoute==='string'&&d.returnRoute.length<250,'Le chemin de retour est invalide.');
    return true;
  }
  const upload=document.createElement('input');upload.type='file';upload.accept='.json,application/json';upload.id='carnet-upload';upload.hidden=true;document.body.append(upload);
  upload.addEventListener('change',async()=>{
    const file=upload.files[0];if(!file)return;
    try{if(file.size>3000000)throw Error('Ce fichier est trop volumineux.');const raw=await file.text();if(/"(?:__proto__|constructor|prototype)"\s*:/.test(raw))throw Error('Le fichier contient une structure non compatible.');const obj=JSON.parse(raw);if(obj.app!=='emlv-app04-ratios'||![2,3].includes(obj.schema)||!obj.data||typeof obj.data!=='object'||Array.isArray(obj.data))throw Error('Ce fichier n’est pas un carnet Ratios compatible.');const d=obj.data;validateImportedState(d);
      if(!confirm('Importer le carnet de '+d.identity.prenom+' '+d.identity.nom+' et remplacer celui de cet appareil ? Pensez à exporter le carnet actuel pour le conserver.')){importNotice='Import annulé. Le carnet actuel est conservé.';render();return;}
      state=d;state.identity={studentId:'',email:'',...d.identity};state.identityValidated=validIdentity(state.identity);for(const k of ['practice','cases','quiz','points','completedActivities','approfondissements','devoir'])state[k]||={};importNotice=state.identityValidated?'Carnet restauré : identité, réponses et progression.':'Carnet restauré. Complétez l’identifiant et l’adresse institutionnelle pour continuer.';save();render('h1',true);
    }catch(err){importNotice='Import refusé : '+err.message+' Le carnet actuel est conservé.';render();}finally{upload.value='';}
  });

  const deepState=id=>state.approfondissements[id]||={stage:'choice',choice:'',choiceWrong:0,wrong:0,transfer:{}};
  function extras(){return title('Travail complémentaire','Approfondissement','Choisissez un exercice. Après un calcul et un raisonnement, un cas différent vérifie que vous savez réutiliser la méthode.')+`<section class="panel"><h2>Des aides au bon moment</h2><p>Première mauvaise réponse : un indice. Deuxième : un indice plus précis. Troisième : la solution expliquée et un retour au cours. Ensuite, réussissez le micro-transfert pour débloquer le bouton vers l’exercice suivant.</p></section><div class="grid">${cases.map((c,i)=>`<a class="card card-link" href="#atelier/${c.id}"><p class="eyebrow">Exercice ${i+1}</p><h2>${esc(c.name)}</h2><p>${esc(c.activity)}</p><strong>${deepState(c.id).transfer.mastered?'✓ Transfert réussi':'Commencer ou reprendre'}</strong></a>`).join('')}</div><section class="panel"><h2>Compléments du cours</h2><p>Retrouvez les rotations, l’EBITDA, les multiples de valorisation, le ROA, le ROIC et DuPont avec un exemple et une application.</p><div class="actions">${advancedLessons.map(l=>anchor('cours/'+l.id,l.title)).join('')}</div></section>`;}
  function deepOptions(c){const valid=[...new Set(c.options.map(o=>o.id))];const plausible=['netMargin','current','bfr','coverage','gearing','pb','staff','intEbe','inventoryDays','quick'];const ids=[...valid,...plausible.filter(x=>!valid.includes(x))].slice(0,4);const shift=cases.indexOf(c)%4;return ids.slice(shift).concat(ids.slice(0,shift));}
  function deepSolution(c,o){return `<div class="feedback"><h3>La solution expliquée</h3><ol><li><b>Question et choix.</b> ${lex(o.why)}</li><li><b>Données et opération.</b> ${lex(o.formula)}${o.value===null?'':` = ${format(numeric.round(o.value,numeric.precision(o.unit)))} ${esc(o.unit)}`}.</li><li><b>Lecture.</b> ${lex(o.reading)}</li><li><b>Limite.</b> ${lex(o.limit)}</li></ol>${courseLink(o.id)}</div>`;}
  function deepHint(c,count,stage){if(!count)return '';const s=deepState(c.id),o=c.options.find(o=>o.id===s.choice)||c.options[0];let hint=count===1?c.hints[0]:c.hints[1];if(stage==='answer'){hint=count===1?'Repérez ce que vous voulez mesurer, puis la base à laquelle le comparer. '+catalogue[o.id].formula: o.value===null?'Vérifiez le dénominateur et les données disponibles. Une base nulle ou un montant absent ne donne pas un ratio interprétable.':'À la calculatrice, saisissez : '+o.formula+'. '+(o.unit==='%'?'La multiplication par 100 transforme le quotient en pourcentage.':'Conservez l’unité demandée, sans ajouter une multiplication par 100.');}return `<div class="hint" role="status"><strong>${count===1?'Indice 1':count===2?'Indice 2':'Correction disponible'}</strong><p>${lex(hint)}</p>${stage==='choice'&&count>=3?`<p>Indicateur attendu : ${c.options.map(o=>esc(catalogue[o.id].name)).filter((v,i,a)=>a.indexOf(v)===i).join(' ou ')}.</p>${courseLink(c.options[0].id)}`:''}</div>`;}
  function exercisePage(id){const c=cases.find(c=>c.id===id);if(!c)return extras();const s=deepState(c.id),o=c.options.find(o=>o.id===s.choice)||c.options[0],t=caseTransfers[o.id],ts=s.transfer;const next=cases[(cases.indexOf(c)+1)%cases.length];return title('Approfondissement · cas fictif',c.name,c.activity)+`${anchor('approfondir','Tous les exercices')}<section class="panel"><h2>La situation</h2><p class="lead">${lex(c.question)}</p><p>${esc(c.period)}</p>${table(c.rows)}</section>
    <section class="panel"><h2>1. Choisir l’indicateur</h2><form data-deep-form="choice" data-id="${c.id}"><fieldset><legend>Quel indicateur répond à la question ?</legend>${deepOptions(c).map(rid=>`<label class="radio"><input type="radio" name="deep-choice" value="${rid}" required ${s.choice===rid?'checked':''} ${s.stage!=='choice'?'disabled':''}><span>${esc(catalogue[rid].name)}</span></label>`).join('')}</fieldset>${s.stage==='choice'?'<button class="primary">Vérifier mon choix</button>':'<p>✓ Indicateur choisi. Vous pouvez calculer et justifier.</p>'}</form>${s.stage==='choice'?deepHint(c,s.choiceWrong,'choice'):''}${s.stage==='choice'&&s.choiceWrong>=3?`<button data-deep-adopt="${c.id}">Reprendre avec cet indicateur</button>`:''}</section>
    ${s.stage!=='choice'?`<section class="panel"><h2>2. Calculer et raisonner</h2><form data-deep-form="answer" data-id="${c.id}">${guidedChoice('why',c,o,s).replaceAll('data-case-field','data-deep-field')}${o.value===null?`<fieldset><legend>Peut-on calculer un ratio interprétable avec ces données ?</legend><label class="radio"><input type="radio" name="deep-feasible" value="yes" ${s.feasible==='yes'?'checked':''} required>Oui, les données et la base conviennent.</label><label class="radio"><input type="radio" name="deep-feasible" value="no" ${s.feasible==='no'?'checked':''} required>Non, une donnée manque ou la base ne permet pas ce calcul.</label></fieldset>`:numericField(s.value,o.unit,'deep-number')}${guidedChoice('interpret',c,o,s).replaceAll('data-case-field','data-deep-field')}<button class="primary">Vérifier le calcul et le raisonnement</button></form>${s.checked?`<div class="feedback ${s.correct?'':'bad'}" role="status"><strong>${s.correct?'Calcul et raisonnement justes.':'Reprenons le point qui bloque.'}</strong><p>${esc(s.message||'')}</p></div>`:''}${!s.correct?deepHint(c,s.wrong,'answer'):''}${s.correct||s.wrong>=3?deepSolution(c,o):courseLink(o.id)}</section>`:''}
    ${s.correct||s.wrong>=3?`<section class="panel transfer-panel"><p class="eyebrow">Vérifier le transfert</p><h2>3. Un nouveau cas : ${esc(t.name)}</h2>${table(t.rows)}<p>Utilisez l’indicateur ${esc(catalogue[o.id].name)}. Les nombres ont changé : retrouvez les bonnes données et refaites le calcul.</p><form data-deep-form="transfer" data-id="${c.id}">${numericField(ts.value,o.unit,'deep-transfer')}<button class="primary">Vérifier le micro-transfert</button></form>${ts.checked?`<div class="feedback ${ts.correct?'':'bad'}" role="status"><strong>${ts.correct?'Micro-transfert réussi.':'Micro-transfert à reprendre.'}</strong><p>${ts.correct||ts.wrong>=3?lex(t.expression+' = '+format(numeric.round(t.value,numeric.precision(o.unit)))+' '+o.unit+'. '+t.reading):ts.wrong===1?'Indice 1 : cherchez la base qui correspond à la question, dans les nouvelles données.':'Indice 2 : '+lex(t.expression)+'. Gardez l’unité demandée.'}</p>${!ts.correct?courseLink(o.id):''}</div>`:''}</section><div class="actions">${ts.mastered?anchor('atelier/'+next.id,'Passer à l’exercice suivant',true):'<p>Le bouton vers l’exercice suivant apparaîtra après un micro-transfert réussi.</p>'}</div>`:''}`;}
  const dstQuestions=[
    {id:'indicateur',type:'one',prompt:'Quel indicateur compare le bénéfice final à la taille des ventes ?',options:['Marge nette','Liquidité générale','BFR','Couverture des intérêts'],key:[0],explain:'La marge nette rapporte le résultat final aux ventes. Les autres indicateurs portent sur les ressources et dettes, le cycle ou les intérêts.',lesson:'marge-nette'},
    {id:'croissance',type:'number',prompt:'Calculez l’évolution du CA de N−1 à N (%).',unit:'%',value:20,explain:'(1 080 − 900) ÷ 900 × 100 = 20 %. La base est l’année de départ.',lesson:'croissance'},
    {id:'marge',type:'number',prompt:'Calculez la marge nette de N (%).',unit:'%',value:3.5,explain:'37,8 ÷ 1 080 × 100 = 3,5 %. En N−1 : 45 ÷ 900 × 100 = 5 %.',lesson:'marge-nette'},
    {id:'liquidite',type:'number',prompt:'Calculez la liquidité générale de N (×).',unit:'×',value:1.2,explain:'270 ÷ 225 = 1,20 ×. En N−1 : 240 ÷ 160 = 1,50 ×.',lesson:'calcul-liquidite'},
    {id:'reduite',type:'number',prompt:'Calculez la liquidité réduite de N, en retenant créances et trésorerie (×).',unit:'×',value:165/225,explain:'(135 + 30) ÷ 225 ≈ 0,73 ×. Les 105 k€ de stocks sont écartés.',lesson:'liquidite-reduite'},
    {id:'diagnostic',type:'many',prompt:'Sélectionnez les deux conclusions justifiées par les comparaisons.',options:['Le bénéfice net représente une part plus faible des ventes','La hausse des ventes prouve une meilleure marge nette','Les ressources courantes par euro de dette courante diminuent','Le ratio supérieur à 1 garantit tous les paiements'],key:[0,2],explain:'La marge nette baisse de 5 % à 3,5 %. La liquidité générale baisse de 1,50 à 1,20. La hausse du CA et un ratio supérieur à 1 ne suffisent pas à conclure à une amélioration globale.',lesson:'evolution-liquidite'},
    {id:'limite',type:'one',prompt:'Quelle information complète le diagnostic sur les paiements ?',options:['Le nombre de pages du bilan','Les dates de règlement des dettes et d’encaissement des clients','Le seul chiffre d’affaires de N','Le montant du capital social à la création'],key:[1],explain:'Il faut vérifier quand les ressources deviendront disponibles et quand les dettes devront être payées.',lesson:'limites-liquidite'},
    {id:'documents',type:'many',prompt:'Pour calculer un ROE, quelles deux données choisissez-vous ?',options:['Résultat net du compte de résultat','Stocks du bilan','Capitaux propres du bilan selon la date retenue','Chiffre d’affaires uniquement'],key:[0,2],explain:'Le ROE rapproche le résultat net annuel et les capitaux propres comptables. La date ou la moyenne utilisée doit être précisée.',lesson:'rentabilite-capitaux'}
  ];
  const dstRows=[['Chiffre d’affaires',900,1080],['Résultat net',45,37.8],['Actif courant',240,270],['Dont stocks',90,105],['Dont créances clients',110,135],['Dont trésorerie',40,30],['Passif courant',160,225]];
  function dstPage(){const d=state.devoir;d.answers||={};return title('Travail complémentaire','Devoir de synthèse · Solstice Équipement','Un entraînement pour mobiliser plusieurs notions. Prévoyez environ 30 minutes, après le parcours ou hors de la séance. Aucun chronomètre ne vous bloque.')+`<section class="panel"><h2>Votre mission</h2><p>Solstice revend du matériel de bureau. La direction veut savoir si la hausse des ventes s’accompagne d’une meilleure rentabilité et d’une meilleure situation pour payer ses dettes. Les données sont fictives, en k€, pour deux exercices de 12 mois.</p>${table(dstRows,['Poste','N−1','N'],'Données du devoir')}<p>Essayez de répondre d’abord sans aide. Les retours au cours restent disponibles. La correction s’affiche lorsque vous terminez le devoir.</p></section><form data-dst-form>${dstQuestions.map((q,i)=>{const s=d.answers[q.id]||{};return `<section class="panel"><fieldset><legend>${i+1}. ${esc(q.prompt)}</legend>${q.type==='number'?`<label for="dst-${q.id}">Votre réponse (${esc(q.unit)})</label><input id="dst-${q.id}" data-dst-id="${q.id}" type="text" inputmode="decimal" value="${esc(s.value||'')}" required>`:`<p>${q.type==='many'?'Deux réponses attendues.':'Une réponse attendue.'}</p>${q.options.map((t,j)=>`<label class="radio"><input data-dst-id="${q.id}" type="${q.type==='many'?'checkbox':'radio'}" name="dst-${q.id}" value="${j}" ${(s.selected||[]).includes(j)?'checked':''}><span>${esc(t)}</span></label>`).join('')}`}</fieldset><a class="button" href="#le-cours/${q.lesson}" data-return-course>Revoir la notion dans le cours</a>${d.corrected?`<div class="feedback ${s.correct?'':'bad'}"><strong>${s.correct?'Réponse juste.':'Point à reprendre.'}</strong><p>${lex(q.explain)}</p></div>`:''}</section>`;}).join('')}<button class="primary">Terminer et voir la correction</button></form>${d.notice?`<p role="alert">${esc(d.notice)}</p>`:''}${d.corrected?`<section class="panel" id="dst-bilan" tabindex="-1"><h2>Bilan de votre entraînement</h2><p><strong>${dstQuestions.filter(q=>d.answers[q.id]?.correct).length} / ${dstQuestions.length}</strong> réponses justes. Ce résultat sert à repérer les notions à consolider.</p><p>Revenez au cours pour les points à reprendre, puis essayez un exercice d’approfondissement sur ces notions.</p>${transferButtons()}${anchor('approfondir','Poursuivre l’entraînement')}</section>`:''}`;}
  main.addEventListener('input',e=>{
    const form=e.target.closest('[data-deep-form]');if(form){const s=deepState(form.dataset.id),kind=form.dataset.deepForm;if(kind==='choice')s.choice=e.target.value;else if(kind==='transfer')s.transfer.value=e.target.value;else if(e.target.dataset.deepField)s[e.target.dataset.deepField]=e.target.value;else if(e.target.name==='deep-feasible')s.feasible=e.target.value;else if(e.target.id==='deep-number')s.value=e.target.value;save();}
    const id=e.target.dataset.dstId;if(id){const s=(state.devoir.answers||={})[id]||={};if(e.target.type==='text')s.value=e.target.value;else s.selected=[...main.querySelectorAll(`[data-dst-id="${id}"]:checked`)].map(x=>Number(x.value));delete state.devoir.corrected;delete state.devoir.notice;save();}
  });
  main.addEventListener('submit',e=>{
    const kind=e.target.dataset.deepForm;
    if(kind){e.preventDefault();e.stopImmediatePropagation();const c=cases.find(c=>c.id===e.target.dataset.id),s=deepState(c.id),o=c.options.find(o=>o.id===s.choice)||c.options[0];
      if(kind==='choice'){if(c.options.some(o=>o.id===s.choice)){s.stage='answer';s.choiceWrong=0;}else s.choiceWrong++;}
      if(kind==='answer'){const number=o.value===null?s.feasible==='no':(()=>{const r=numeric.parse(s.value||'',o.unit);return !r.error&&numeric.matches(r.value,o.value,o.unit);})();s.correct=number&&s.why==='0'&&s.interpret==='0';s.checked=true;s.message=s.correct?'Votre choix, le calcul et la conclusion sont cohérents.':!number?'Vérifiez la base, les montants et l’unité du calcul.':s.why!=='0'?'La justification doit répondre à la question de l’entreprise.':'La conclusion doit respecter ce que le ratio mesure et ses limites.';if(!s.correct)s.wrong++;}
      if(kind==='transfer'){const t=caseTransfers[o.id],r=numeric.parse(s.transfer.value||'',o.unit),ts=s.transfer;ts.correct=!r.error&&numeric.matches(r.value,t.value,o.unit);ts.checked=true;if(ts.correct)ts.mastered=true;else ts.wrong=(ts.wrong||0)+1;}
      save();render('h1');return;}
    if(e.target.matches('[data-dst-form]')){e.preventDefault();e.stopImmediatePropagation();const d=state.devoir;d.answers||={};const missing=dstQuestions.some(q=>{const s=d.answers[q.id];return !s||(q.type==='number'?!s.value?.trim():!s.selected?.length);});if(missing){d.notice='Répondez à toutes les questions avant d’afficher la correction.';save();render('h1');return;}for(const q of dstQuestions){const s=d.answers[q.id];if(q.type==='number'){const r=numeric.parse(s.value,q.unit);s.correct=!r.error&&numeric.matches(r.value,q.value,q.unit);}else s.correct=JSON.stringify([...s.selected].sort())===JSON.stringify([...q.key].sort());}d.corrected=true;delete d.notice;save();render('#dst-bilan');}
  },true);
  document.addEventListener('click',e=>{const b=e.target.closest('[data-deep-adopt]');if(b){const c=cases.find(c=>c.id===b.dataset.deepAdopt),s=deepState(c.id);s.choice=c.options[0].id;s.stage='answer';save();render('h1');}});

  rememberCompletedActivities();
  setRoute();
  render();
})();

</script>
