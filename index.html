<!doctype html>

<title>Calculer et interpréter les ratios financiers · EMLV</title>
<style>
:root{--ink:#123c3a;--teal:#00685e;--accent:#c5a56c;--muted:#4c6763;--pale:#e7f3ee;--paper:#faf9f4;--line:#cddcd5;--dark:#103c39;--white:#fff;--error:#842d38}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.58 "Instrument Sans",system-ui,sans-serif}
.wrap{width:min(1160px,calc(100% - 3rem));margin-inline:auto}
.site-head,nav{background:#fff} .head-inner,.nav-inner,.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.head-inner{min-height:87px}.brand{display:flex;align-items:center;gap:1.1rem;text-decoration:none;color:var(--ink);line-height:1.27}.brand img{object-fit:contain}.brand span{border-inline-start:1px solid var(--accent);padding-inline-start:1.1rem;font-size:.95rem}
.back-dst{font-weight:700}.nav-inner{justify-content:flex-start;gap:.3rem;flex-wrap:wrap;padding:.32rem 0}
nav{border-block:1px solid var(--line)}nav a{padding:.65rem .83rem;color:var(--ink);text-decoration:none;border-radius:.38rem;font-size:.93rem}nav a[aria-current]{background:var(--pale);box-shadow:inset 0 -2px var(--accent);font-weight:750}
main{min-height:70vh;padding:2.8rem 0 4rem}footer{background:white;border-top:1px solid var(--line);padding:1.2rem 0;color:var(--muted);font-size:.88rem}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:500;line-height:1.12;margin:.1em 0 .43em;overflow-wrap:anywhere}
h1{font-size:clamp(2.35rem,5.3vw,4.7rem);letter-spacing:-.045em}h2{font-size:clamp(1.58rem,3.4vw,2.43rem)}h3{font-size:1.4rem}
p{margin:.25rem 0 1rem}a{color:var(--teal);text-underline-offset:.19em}
button,select,input,textarea{font:inherit;color:inherit}button,a,select{touch-action:manipulation}
button,.button,select{min-height:44px;border:1px solid var(--line);border-radius:.48rem;padding:.56rem .85rem;background:#fff}
button,.button{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:left;line-height:1.35}
button:hover,.button:hover{background:var(--pale);border-color:var(--teal)}button:disabled{opacity:.6;cursor:default}
.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}.primary:hover{background:#004e46}
:focus-visible{outline:3px solid #98571a;outline-offset:3px}.skip{position:absolute;top:-100px;left:12px;background:white;z-index:20;padding:10px}.skip:focus{top:10px}
.hero{display:grid;grid-template-columns:1.12fr .88fr;min-height:420px;overflow:hidden;border-radius:1rem;background:white;border:1px solid var(--line)}
.hero-copy{padding:clamp(1.4rem,5vw,4.2rem);align-self:center}.hero-copy h1{font-size:clamp(2.3rem,5.6vw,4.9rem)}.hero-copy h1 span{color:var(--teal)}
.hero-data{background:var(--dark);color:#fff;padding:clamp(1.4rem,4.8vw,3.6rem);display:flex;flex-direction:column;justify-content:center;gap:1.1rem}
.hero-data .eyebrow,.hero-data .muted{color:#c6e1d7}.hero-data h2{font-size:clamp(1.6rem,3vw,2.5rem);margin:0}.hero-data p{margin:0}
.bar-row{display:grid;grid-template-columns:5.4rem 1fr 3.65rem;align-items:center;gap:.58rem;font-size:.9rem}.bar{height:.56rem;background:#42635c;border-radius:1rem;overflow:hidden}.bar i{display:block;height:100%;background:#a6d9c8;border-radius:inherit}.bar-row:nth-of-type(2) .bar i{background:#e1c18a}.bar-row strong{text-align:right}
.eyebrow{font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;font-weight:790;color:var(--teal);margin:0 0 .65rem}.lead{font-size:1.12rem;max-width:63ch}.muted,small{color:var(--muted)}
.row,.tags,.actions,.chips{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.actions{margin-top:.75rem}.actions a{font-weight:680}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}.section-space{margin-top:2.4rem}
.card,.panel{padding:clamp(1rem,3vw,1.7rem);background:white;border:1px solid var(--line);border-radius:.75rem;min-width:0}
.card p:last-child,.panel p:last-child{margin-bottom:0}.card-link{display:block;text-decoration:none;color:var(--ink)}.card-link:hover{border-color:var(--teal);background:var(--pale)}.card-link b{color:var(--teal)}
.page-head{margin-bottom:1.55rem}.page-head h1{font-size:clamp(2.2rem,5vw,3.85rem)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.52rem;margin:0 0 1.2rem}
.flow a{display:flex;align-items:center;padding:.55rem .65rem;background:white;border:1px solid var(--line);border-radius:.4rem;text-decoration:none;min-height:46px}.flow a[aria-current]{font-weight:750;background:var(--pale);border-color:var(--teal)}
.two,.selectors,.atlas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
.atlas{grid-template-columns:minmax(225px,.75fr) minmax(0,2fr)}.catalogue-list{display:grid;gap:.35rem}
.catalogue-list button{justify-content:flex-start;width:100%}.catalogue-list button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--pale);border-color:var(--teal);font-weight:700}
.tag{font-size:.79rem;border:1px solid #c2d7cd;border-radius:2rem;padding:.2rem .55rem;background:var(--pale);color:var(--ink)}.tag.core{background:#f3e9d7;border-color:#d4b67d}
.formula{background:var(--pale);border-inline-start:4px solid var(--teal);padding:.73rem .85rem;margin:.8rem 0;font-weight:720;overflow-wrap:anywhere}
dl{margin:.9rem 0}dt{font-weight:760}dd{margin:0 0 .65rem}.source-links{margin-top:1rem;font-size:.91rem}.source-links a{display:inline-block;margin:.18rem .55rem .18rem 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}caption{text-align:left;font-weight:750;margin-bottom:.35rem}th,td{padding:.46rem .4rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td{text-align:right}thead{background:var(--pale)}tbody th{font-weight:550}
.term{display:inline;min-height:0;border:0;border-radius:0;padding:0;color:var(--teal);background:transparent;text-decoration:underline dotted;text-underline-offset:.2em;vertical-align:baseline}.term:hover{background:#dcefe5}.term:focus-visible{outline-offset:2px}
label,.field-label{display:block;font-weight:720;margin:.6rem 0 .35rem}select,input[type=text],textarea{width:100%;min-height:44px;border:1px solid #8ca49b;border-radius:.4rem;background:white;padding:.53rem .67rem}textarea{resize:vertical}
.option-area{position:relative}.option-area > button{width:100%;justify-content:space-between}.options{list-style:none;margin:.35rem 0 0;padding:.3rem;max-height:250px;overflow:auto;background:white;border:1px solid var(--line);border-radius:.45rem}.options button{width:100%;justify-content:flex-start;border:0;min-height:44px}.options button[aria-pressed=true]{background:var(--pale);font-weight:750}
[hidden]{display:none!important}.preview{margin:.5rem 0 0;padding:.8rem;background:var(--paper);border:1px solid var(--line);border-radius:.45rem}.preview p{margin:.3rem 0}.preview h3{font-size:1.2rem}
.feedback{background:var(--pale);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:.4rem;padding:.8rem 1rem;margin:.8rem 0}.feedback.bad{border-left-color:var(--error)}.feedback p:last-child{margin-bottom:0}
details{margin:1rem 0;padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:.5rem}summary{cursor:pointer;font-weight:740;min-height:28px}details[open] summary{margin-bottom:.65rem}
fieldset{border:1px solid var(--line);border-radius:.55rem;margin:0 0 1rem;padding:.8rem 1rem}legend{font-weight:750;padding:0 .3rem}.radio{display:flex;align-items:center;gap:.6rem;font-weight:520;min-height:42px;margin:0}.radio input{accent-color:var(--teal);flex:0 0 auto}
.stack>*+*{margin-top:.9rem}.steps{padding-inline-start:1.25rem}.steps li{margin:.35rem 0}
dialog{color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:.8rem;width:min(660px,calc(100% - 2rem));max-height:84dvh;overflow:auto;padding:1rem 1.25rem 1.4rem}dialog::backdrop{background:#0b2a27aa}
.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:.8rem;border-bottom:1px solid var(--line);margin-bottom:.8rem;padding-bottom:.55rem}.dialog-head h2{margin:.15em 0}.dialog-head button{flex-shrink:0}
#storage-alert:not(:empty){padding:.7rem 0;color:var(--error)}
@media(max-width:780px){.hero{min-height:auto}.hero,.atlas{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-data{gap:.7rem}.hero-copy h1{max-width:15ch}}
@media(max-width:570px){.wrap{width:calc(100% - 1.45rem)}.head-inner{min-height:67px;gap:.3rem}.brand{gap:.36rem}.brand img{width:53px;height:45px}.brand span{font-size:.75rem;padding-inline-start:.4rem}.back-dst{font-size:.77rem}main{padding:1.35rem 0 2.3rem}.nav-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.12rem}.nav-inner a{font-size:.78rem;min-height:44px;padding:.48rem .23rem;display:grid;place-items:center;text-align:center}.hero-copy,.hero-data{padding:1.08rem}.grid,.two,.selectors{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.flow a{font-size:.86rem}.footer-inner{align-items:start;flex-direction:column;gap:.14rem}th,td{padding:.41rem .24rem}.card,.panel{padding:.87rem}.bar-row{gap:.35rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
.catalogue-list{max-height:26rem;overflow:auto;padding:.2rem}
@media(max-width:570px){.catalogue-list{max-height:12rem}}
h1[tabindex="-1"]:focus{outline:none}

.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.progress-panel,.milestone{margin-block:1rem}
.progress-panel h2,.milestone h2{font-size:clamp(1.35rem,2.3vw,1.8rem);margin:0}
.progress-heading,.progress-meta,.milestone{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.55rem 1.2rem}
.progress-heading>strong{font-size:1.3rem;color:var(--teal)}
.progress-panel progress{display:block;width:100%;height:.75rem;margin:.75rem 0;border:0;border-radius:1rem;overflow:hidden;background:var(--pale);accent-color:var(--teal)}
.progress-panel progress::-webkit-progress-bar{background:var(--pale)}
.progress-panel progress::-webkit-progress-value{background:var(--teal)}
.progress-panel progress::-moz-progress-bar{background:var(--teal)}
.progress-meta{font-size:.94rem;margin-bottom:.35rem}
.milestone p{margin:.3rem 0 0}
.milestone{border-inline-start:.25rem solid var(--teal)}
.diagnostic-check{margin-block:.8rem}

</style>
</head>

<script>
window.EMLV_LEXICON={"version":"1.0","terms":[{"id":"actif","label":"Actif","acronym":"","aliases":[],"definition":"Ensemble des ressources contrôlées par l’entreprise, issues d’événements passés et dont elle attend des avantages économiques.","context":"Au bilan, il regroupe notamment les immobilisations, les stocks, les créances et les disponibilités.","example":"Un ordinateur utilisé, des produits en stock et une facture client à encaisser sont des actifs.","misconception":"Le total de l’actif n’est pas l’argent disponible en banque.","related":["bilan","stock","creance-client"]},{"id":"passif","label":"Passif","acronym":"","aliases":[],"definition":"Dans la présentation du bilan, ensemble des financements figurant en face de l’actif : capitaux propres et dettes.","context":"Dans un sens comptable plus strict, les passifs comprennent les obligations envers les tiers ; les capitaux propres sont présentés séparément.","example":"Un emprunt de 100 k€ est une dette ; un apport de 100 k€ appartient aux capitaux propres.","misconception":"Toutes les lignes du passif ne sont pas des dettes remboursables.","related":["bilan","capitaux-propres","dette"]},{"id":"bilan","label":"Bilan","acronym":"","aliases":[],"definition":"État financier qui présente les actifs, les capitaux propres et les dettes à une date donnée.","context":"Il répond à la question : que contrôle l’entreprise et comment ces ressources sont-elles financées à la clôture ?","example":"Le bilan au 31 décembre présente les stocks encore détenus ce jour-là.","misconception":"Un bilan est une photographie à une date ; les ventes annuelles sont dans le compte de résultat.","related":["actif","passif","compte-resultat"]},{"id":"compte-resultat","label":"Compte de résultat","acronym":"","aliases":[],"definition":"État qui rapproche les produits et les charges rattachés à une période pour déterminer un bénéfice ou une perte.","context":"Il décrit la formation du résultat sur douze mois dans les exercices proposés.","example":"1 000 k€ de produits moins 950 k€ de charges donnent 50 k€ de bénéfice.","misconception":"Un produit n’est pas toujours déjà encaissé et une charge n’est pas toujours déjà payée.","related":["produit","charge","resultat-net"]},{"id":"tableau-flux","label":"Tableau des flux de trésorerie","acronym":"","aliases":["tableau de flux","tableau des flux"],"definition":"État qui explique la variation de trésorerie entre deux dates par les flux d’exploitation, d’investissement et de financement.","context":"Il rapproche la trésorerie d’ouverture de celle de clôture et permet de comprendre d’où vient ou où part l’argent.","example":"Flux d’exploitation +60, investissement −90 et financement +40 : trésorerie en hausse de 10 k€.","misconception":"Un bénéfice de 60 k€ ne garantit pas un flux d’exploitation de 60 k€.","related":["flux-exploitation","flux-investissement","flux-financement"]},{"id":"produit","label":"Produit","acronym":"","aliases":["produits"],"definition":"Élément qui augmente le résultat de la période selon les règles comptables, indépendamment de sa date d’encaissement.","context":"Les ventes, certains intérêts reçus et la production stockée sont des produits de nature différente.","example":"Une prestation de décembre facturée 20 k€ est un produit de décembre même si le client paie en janvier.","misconception":"Tous les produits ne sont pas des ventes ou des encaissements.","related":["vente","production-stockee","encaissement"]},{"id":"charge","label":"Charge","acronym":"","aliases":["charges"],"definition":"Consommation ou diminution d’avantages économiques rattachée à une période et qui diminue son résultat.","context":"Les marchandises vendues, les loyers, les salaires, les amortissements et les intérêts sont des charges.","example":"Un loyer de décembre de 3 k€ est une charge de décembre même payé en janvier.","misconception":"Une charge n’est pas systématiquement un décaissement de la période ; acheter une machine ne crée pas immédiatement une charge égale à son prix.","related":["decaissement","amortissement","immobilisation"]},{"id":"vente","label":"Vente","acronym":"","aliases":["ventes"],"definition":"Opération par laquelle l’entreprise fournit un bien ou un service à un client en échange d’une rémunération.","context":"Elle peut concerner une marchandise revendue, un bien fabriqué, un abonnement ou une prestation. Les cessions d’immobilisations sont traitées séparément du chiffre d’affaires usuel.","example":"Un commerce revend des chaussures ; un atelier vend un meuble fabriqué ; un cabinet vend une mission.","misconception":"Vendre ne signifie pas que le paiement a déjà été reçu.","related":["chiffre-affaires","marchandise","creance-client"]},{"id":"chiffre-affaires","label":"Chiffre d’affaires","acronym":"CA","aliases":["chiffre d'affaires","Revenue"],"definition":"Montant hors taxes des ventes de biens et de services relevant de l’activité courante sur une période.","context":"Il comprend les ventes de marchandises et la production vendue ; il sert de dénominateur aux marges rapportées aux ventes.","example":"300 k€ de marchandises et 700 k€ de prestations donnent un CA de 1 000 k€.","misconception":"Le CA n’est ni le bénéfice, ni le total des produits, ni le total des encaissements.","related":["vente","production-vendue","resultat-net"]},{"id":"marchandise","label":"Marchandise","acronym":"","aliases":["marchandises"],"definition":"Bien acheté pour être revendu sans transformation substantielle.","context":"La marge commerciale mesure le solde dégagé par cette activité d’achat-revente.","example":"Des écouteurs achetés à un fournisseur puis revendus sont des marchandises ; une table fabriquée par l’entreprise est un produit fini.","misconception":"Un produit fabriqué n’est pas assimilé à une marchandise dans les SIG.","related":["marge-commerciale","production-vendue","stock"]},{"id":"stock","label":"Stock","acronym":"","aliases":["stocks"],"definition":"Biens détenus pour être vendus, en cours de production ou destinés à être consommés dans la production.","context":"C’est un montant au bilan à une date. Distinguer marchandises, matières premières et production fabriquée.","example":"Un stock de 50 k€ au 31 décembre n’est pas encore intégralement vendu ou consommé.","misconception":"Le stock n’est pas une réserve d’argent disponible ; sa vente peut encore coûter et son prix futur est incertain.","related":["bilan","stock-initial","stock-final"]},{"id":"stock-initial","label":"Stock initial","acronym":"","aliases":[],"definition":"Valeur du stock présent au début de la période considérée.","context":"Pour les marchandises vendues, il est ajouté aux achats car des biens déjà détenus peuvent être vendus pendant l’exercice.","example":"Stock initial 30 + achats 100 : 130 k€ de marchandises disponibles avant déduction du stock final.","misconception":"Le stock initial de marchandises ne doit pas être remplacé par la totalité des stocks d’une entreprise mixte.","related":["stock","stock-final","cout-marchandises"]},{"id":"stock-final","label":"Stock final","acronym":"","aliases":[],"definition":"Valeur du stock encore détenu à la fin de la période.","context":"Pour déterminer le coût des marchandises vendues, il est retiré des marchandises disponibles car ces biens ne sont pas encore vendus.","example":"Stock initial 30 + achats 100 − stock final 40 = coût vendu 90 k€.","misconception":"Une hausse du stock final réduit le coût vendu à achats donnés ; elle ne crée pas à elle seule de trésorerie.","related":["stock-initial","cout-marchandises","variation-stock"]},{"id":"variation-stock","label":"Variation de stock","acronym":"","aliases":[],"definition":"Différence entre deux valeurs de stock, dont le signe doit être défini avant tout calcul.","context":"Au bilan, variation = stock final − stock initial. Dans un calcul de consommation, la variation à ajouter aux achats est stock initial − stock final.","example":"Le stock passe de 30 à 40 : il augmente de 10 ; la consommation est égale aux achats moins 10.","misconception":"Employer le mot « variation » sans préciser la convention peut inverser le signe du coût ou du flux de trésorerie.","related":["stock-initial","stock-final","cout-marchandises"]},{"id":"cout-marchandises","label":"Coût des marchandises vendues","acronym":"","aliases":["coût vendu","coût d’achat des marchandises vendues"],"definition":"Coût d’acquisition rattaché aux marchandises effectivement vendues pendant la période.","context":"Dans les cas simplifiés : stock initial + achats de marchandises − stock final. Les frais d’acquisition sont supposés déjà compris dans les valeurs fournies.","example":"20 + 100 − 30 = 90 k€ : le coût des biens encore en stock est exclu de la charge des biens vendus.","misconception":"Il ne comprend pas ici les salaires commerciaux, les loyers ou les intérêts ; les achats ne sont égaux au coût vendu que si le stock ne varie pas.","related":["marge-commerciale","stock-initial","stock-final"]},{"id":"marge-commerciale","label":"Marge commerciale","acronym":"","aliases":[],"definition":"Différence entre les ventes de marchandises et le coût d’achat des marchandises effectivement vendues.","context":"Elle isole l’apport de l’achat-revente avant les autres consommations, les salaires, les taxes, les amortissements et la finance.","example":"Ventes 150 − coût vendu 100 = marge commerciale 50 k€. Si les autres charges dépassent 50, l’entreprise peut rester déficitaire.","misconception":"Ce n’est pas une marge nette. Le terme « marge brute » peut désigner un autre périmètre : toujours définir la formule.","related":["marchandise","cout-marchandises","resultat-net"]},{"id":"production-vendue","label":"Production vendue","acronym":"","aliases":[],"definition":"Ventes de biens fabriqués et de services produits par l’entreprise.","context":"Elle est une composante du CA, distincte des ventes de marchandises.","example":"Une entreprise facture 80 k€ de conseil et vend 120 k€ de meubles fabriqués : production vendue de 200 k€.","misconception":"Il ne faut pas ajouter une deuxième fois la production vendue à un CA qui la contient déjà.","related":["production-exercice","chiffre-affaires","production-stockee"]},{"id":"production-stockee","label":"Production stockée","acronym":"","aliases":[],"definition":"Variation de valeur des stocks de produits fabriqués et de travaux en cours sur la période.","context":"Positive, elle traduit une augmentation de la production non encore vendue ; négative, un déstockage. Elle est distincte d’une variation de stock de marchandises.","example":"Des produits finis passent de 20 à 35 k€ : production stockée de +15 k€.","misconception":"Elle contribue au résultat comptable sans être une vente ou un encaissement.","related":["production-exercice","stock","produit"]},{"id":"production-immobilisee","label":"Production immobilisée","acronym":"","aliases":[],"definition":"Production réalisée par l’entreprise pour elle-même et inscrite à l’actif comme immobilisation.","context":"Elle entre dans la production de l’exercice lorsque les critères comptables sont remplis ; elle est nulle dans les exercices simplifiés proposés.","example":"Une entreprise construit pour elle-même un équipement durable ; son coût éligible est immobilisé.","misconception":"Elle ne correspond pas à une vente à un client extérieur ni à une entrée d’argent.","related":["production-exercice","immobilisation","produit"]},{"id":"production-exercice","label":"Production de l’exercice","acronym":"","aliases":[],"definition":"Somme de la production vendue, de la production stockée et de la production immobilisée.","context":"Ce solde mesure la production comptabilisée pendant la période, hors achat-revente de marchandises.","example":"Production vendue 500 + stockée 20 + immobilisée 0 = 520 k€.","misconception":"Elle peut dépasser les ventes sans hausse immédiate de trésorerie.","related":["production-vendue","production-stockee","production-immobilisee"]},{"id":"consommations-externes","label":"Consommations externes","acronym":"","aliases":["consommation externe"],"definition":"Biens et services acquis auprès de tiers et consommés dans la période, dans le périmètre du calcul de valeur ajoutée.","context":"On retient les matières consommées et les autres achats et charges externes ; le coût marchandises est déjà traité dans la marge commerciale.","example":"Matières 80, loyers 20 et prestations externes 15 réduisent la richesse créée en interne.","misconception":"Les salaires des salariés de l’entreprise ne sont pas des consommations externes dans les SIG comptables simplifiés.","related":["valeur-ajoutee","charges-externes","personnel"]},{"id":"matieres-consommees","label":"Matières consommées","acronym":"","aliases":[],"definition":"Coût des matières premières et fournitures utilisées dans la production durant l’exercice.","context":"Si le coût consommé est déjà fourni, ne pas lui appliquer à nouveau une variation de stocks.","example":"Une usine consomme du bois pour fabriquer les meubles vendus ou stockés.","misconception":"Achats de matières et matières consommées diffèrent lorsque le stock de matières varie.","related":["consommations-externes","variation-stock","valeur-ajoutee"]},{"id":"charges-externes","label":"Autres achats et charges externes","acronym":"","aliases":["autres charges externes","charge externe","autres charges externes"],"definition":"Services et autres consommations achetés à des tiers et rattachés à la période.","context":"Exemples : loyers, énergie, assurance, publicité, honoraires, sous-traitance. Ils sont déduits pour calculer la VA dans les cas proposés.","example":"Un loyer de boutique de 30 k€ réduit la VA de 30 k€.","misconception":"Ne pas retirer à nouveau ces charges après avoir repris une VA qui les déduit déjà.","related":["consommations-externes","valeur-ajoutee","charge"]},{"id":"valeur-ajoutee","label":"Valeur ajoutée","acronym":"VA","aliases":[],"definition":"Solde qui mesure la richesse créée par l’activité après les consommations provenant de tiers.","context":"VA = marge commerciale + production de l’exercice − consommations externes. Elle sert notamment à rémunérer le personnel, les administrations et les financeurs.","example":"Marge commerciale 100 + production 200 − consommations externes 120 = VA 180 k€.","misconception":"Ce n’est pas le bénéfice des actionnaires : les salaires et de nombreuses autres charges restent à couvrir.","related":["marge-commerciale","production-exercice","ebe"]},{"id":"personnel","label":"Charges de personnel","acronym":"","aliases":["personnel","salaires et cotisations sociales"],"definition":"Rémunérations et cotisations sociales supportées par l’entreprise au titre de ses salariés.","context":"Elles sont déduites de la VA pour calculer l’EBE. Le coût employeur dépasse généralement le seul salaire net versé.","example":"Salaire brut 30 + cotisations patronales 12 : coût employeur 42 k€ dans cet exemple.","misconception":"Une hausse du total ne prouve pas un sureffectif : vérifier effectifs, rémunérations, activité, mix des compétences et qualité.","related":["ebe","valeur-ajoutee","poids-charges"]},{"id":"impots-exploitation","label":"Impôts et taxes d’exploitation","acronym":"","aliases":["impôts et taxes"],"definition":"Taxes liées à l’activité, distinctes de l’impôt calculé sur les bénéfices.","context":"Elles sont déduites pour calculer l’EBE dans les SIG simplifiés.","example":"Une taxe locale ou une taxe assise sur les salaires peut relever de ce poste selon le cadre applicable.","misconception":"L’impôt sur les bénéfices n’est pas déduit à cette étape.","related":["ebe","impot-benefices","charge"]},{"id":"subvention-exploitation","label":"Subvention d’exploitation","acronym":"","aliases":[],"definition":"Aide comptabilisée en produit pour soutenir l’activité ou compenser certaines charges d’exploitation.","context":"Elle est ajoutée à la VA pour calculer l’EBE dans la présentation retenue. Elle est nulle dans les cas proposés.","example":"VA 100 + subvention 5 − personnel 70 − taxes 5 = EBE 30 k€.","misconception":"Une subvention comptabilisée n’est pas nécessairement encaissée le même jour.","related":["ebe","produit","encaissement"]},{"id":"ebe","label":"Excédent brut d’exploitation","acronym":"EBE","aliases":["excédent brut d'exploitation"],"definition":"Solde de l’exploitation avant amortissements, financement et impôt sur les bénéfices.","context":"EBE = VA + subventions d’exploitation − impôts et taxes d’exploitation − charges de personnel. Négatif, il constitue une insuffisance brute d’exploitation.","example":"VA 200 − personnel 140 − taxes 10 = EBE 50 k€ ; amortissements et intérêts restent à couvrir.","misconception":"L’EBE n’est ni le résultat net ni le flux de trésorerie d’exploitation : les décalages de paiement et les stocks comptent.","related":["valeur-ajoutee","amortissement","flux-exploitation"]},{"id":"amortissement","label":"Amortissement","acronym":"","aliases":["dotations aux amortissements","dotation aux amortissements","amortissements"],"definition":"Répartition comptable du montant amortissable d’une immobilisation sur sa durée d’utilisation, selon sa consommation attendue.","context":"La dotation annuelle diminue le résultat d’exploitation sans entraîner en elle-même un paiement de l’année.","example":"Un équipement de 100 k€ amorti linéairement sur cinq ans sans valeur résiduelle donne 20 k€ de dotation annuelle.","misconception":"La dotation n’est pas une somme mise en réserve sur un compte bancaire ; le prix d’achat et la charge annuelle sont distincts.","related":["immobilisation","resultat-exploitation","capex"]},{"id":"immobilisation","label":"Immobilisation","acronym":"","aliases":["immobilisations","immobilisations nettes","Property and equipment"],"definition":"Actif destiné à être utilisé durablement par l’entreprise plutôt qu’à être vendu dans le cycle courant.","context":"Au bilan, sa valeur nette tient compte notamment des amortissements cumulés. Les acquisitions payées sont des flux d’investissement.","example":"Une machine de production est une immobilisation ; les produits fabriqués pour les clients sont des stocks.","misconception":"L’achat de la machine ne devient pas immédiatement une charge égale à son prix.","related":["actif","amortissement","capex"]},{"id":"resultat-exploitation","label":"Résultat d’exploitation","acronym":"RE","aliases":["résultat d'exploitation","Income from operations","Operating income"],"definition":"Solde des produits et charges liés à l’activité d’exploitation, après les charges calculées comme les amortissements.","context":"Dans ces cas sans autres postes : RE = EBE − dotations aux amortissements.","example":"EBE 60 − amortissements 25 = RE 35 k€.","misconception":"Un RE positif ne garantit pas un résultat net positif : les intérêts et l’impôt restent à prendre en compte.","related":["ebe","resultat-financier","rcai"]},{"id":"resultat-financier","label":"Résultat financier","acronym":"RF","aliases":[],"definition":"Différence entre les produits financiers et les charges financières comptabilisés sur la période.","context":"Il traduit notamment le coût des intérêts et les revenus de certains placements, sans intégrer le remboursement du capital des emprunts.","example":"Produits financiers 2 − intérêts 9 = résultat financier −7 k€.","misconception":"Un nouvel emprunt encaissé n’est pas un produit financier ; son remboursement en capital n’est pas une charge.","related":["interet","emprunt","rcai"]},{"id":"interet","label":"Intérêt","acronym":"","aliases":["intérêts","charges financières"],"definition":"Rémunération due au prêteur pour la mise à disposition d’un financement pendant une durée.","context":"Les intérêts diminuent le résultat financier ; ils sont distincts du remboursement du principal.","example":"Une échéance de 12 k€ comprend 10 de capital et 2 d’intérêts : la charge financière est 2, pas 12.","misconception":"Le capital remboursé n’est pas une charge d’intérêt.","related":["emprunt","resultat-financier","couverture-interets"]},{"id":"rcai","label":"Résultat courant avant impôts","acronym":"RCAI","aliases":["résultat courant avant impôt"],"definition":"Solde obtenu en additionnant le résultat d’exploitation et le résultat financier dans les cas proposés.","context":"Il permet de lire la performance courante après le financement mais avant l’impôt sur les bénéfices et les éventuels éléments non courants.","example":"RE 35 + RF −7 = RCAI 28 k€.","misconception":"Ce n’est pas le résultat net si un impôt ou d’autres éléments doivent encore être pris en compte.","related":["resultat-exploitation","resultat-financier","resultat-net"]},{"id":"resultat-net","label":"Résultat net","acronym":"RN","aliases":["Net income"],"definition":"Solde final des produits et charges de la période : positif, un bénéfice ; négatif, une perte.","context":"Dans les cas sans exceptionnel ni participation : RN = RCAI − impôt sur les bénéfices.","example":"RCAI 28 − impôt 7 = bénéfice 21 k€ ; RCAI −10 et impôt nul = perte 10 k€.","misconception":"Un bénéfice n’est pas un solde bancaire : crédit clients, stocks, investissement et financement peuvent modifier le cash.","related":["compte-resultat","rcai","tresorerie"]},{"id":"impot-benefices","label":"Impôt sur les bénéfices","acronym":"","aliases":["impôt sur les bénéfices","impôt sur les sociétés","IS"],"definition":"Charge fiscale relative aux bénéfices imposables selon les règles applicables.","context":"Dans les exercices, son montant est fourni : le déduire après le RCAI dans le périmètre simplifié.","example":"RCAI 100 et impôt fourni 24 donnent un RN de 76 k€.","misconception":"Ne pas appliquer un taux supposé au résultat comptable : résultat fiscal et comptable peuvent différer.","related":["rcai","resultat-net","impots-exploitation"]},{"id":"sig","label":"Soldes intermédiaires de gestion","acronym":"SIG","aliases":[],"definition":"Étapes de calcul qui expliquent comment se forme le résultat en séparant les mécanismes de l’activité, de la consommation et du financement.","context":"Ils comprennent notamment marge commerciale, production, VA, EBE, RE et RCAI dans le cadre français utilisé ici.","example":"Un CA en hausse peut coexister avec un EBE en baisse si les consommations et salaires progressent plus vite.","misconception":"Ces soldes ne sont pas des soldes bancaires et leur présentation ne doit pas être plaquée directement sur des comptes étrangers sans adaptation.","related":["marge-commerciale","ebe","rcai"]},{"id":"retraitement","label":"Retraitement","acronym":"","aliases":["retraitements"],"definition":"Modification analytique de la présentation de certains postes pour mieux comparer ou comprendre la réalité économique, en explicitant les règles retenues.","context":"Un retraitement peut reclasser une charge entre consommations externes et personnel. Aucun calcul de retraitement des SIG n’est demandé dans cette application.","example":"Une analyse peut identifier séparément certains coûts de personnel extérieur pour étudier l’ensemble des ressources humaines.","misconception":"Ce n’est pas une correction libre des chiffres ni une permission de choisir une formule sans justification.","related":["sig","charges-externes","personnel"]},{"id":"creance-client","label":"Créance client","acronym":"","aliases":["créances clients","créance","créances","Accounts receivable"],"definition":"Droit de l’entreprise à recevoir un paiement d’un client après une vente non encore réglée.","context":"Elle figure à l’actif du bilan. Sa hausse peut contribuer à expliquer pourquoi une hausse des ventes n’apporte pas immédiatement autant de cash.","example":"Une facture de 10 k€ non réglée à la clôture augmente les créances de 10 k€.","misconception":"Une créance n’est pas encore de l’argent disponible et son recouvrement n’est pas garanti.","related":["actif","encaissement","bfr"]},{"id":"dette","label":"Dette","acronym":"","aliases":["dettes"],"definition":"Obligation de payer un tiers, selon des conditions déterminées.","context":"Au bilan, distinguer dettes fournisseurs, dettes fiscales et sociales et emprunts : leurs causes et échéances diffèrent.","example":"Une facture fournisseur non payée est une dette, même si elle ne porte pas d’intérêt.","misconception":"Toutes les dettes ne sont pas des emprunts et une dette ne décrit pas à elle seule une charge de la période.","related":["dette-fournisseur","emprunt","passif"]},{"id":"dette-fournisseur","label":"Dette fournisseur","acronym":"","aliases":["dettes fournisseurs"],"definition":"Montant dû à un fournisseur pour un achat ou une prestation reçu et non encore payé.","context":"Sa hausse, toutes choses égales par ailleurs, retarde un décaissement et soutient temporairement la trésorerie d’exploitation.","example":"Un achat consommé de 20 k€ payé le mois suivant peut diminuer le résultat avant de diminuer la trésorerie.","misconception":"Retarder un paiement ne supprime pas la charge et peut créer un risque pour la relation fournisseur.","related":["dette","decaissement","bfr"]},{"id":"emprunt","label":"Emprunt","acronym":"","aliases":["emprunts","emprunts bancaires","capital des emprunts"],"definition":"Financement reçu d’un prêteur, qui crée une dette et doit être remboursé selon le contrat.","context":"L’encaissement et le remboursement du capital sont des flux de financement. Les intérêts sont traités séparément en charge financière.","example":"Recevoir 100 k€ augmente banque et dette de 100 ; cela n’ajoute pas 100 au bénéfice.","misconception":"Un prêt ne constitue pas un chiffre d’affaires ; rembourser son capital ne diminue pas le résultat.","related":["dette","interet","flux-financement"]},{"id":"capitaux-propres","label":"Capitaux propres","acronym":"","aliases":["Stockholders’ equity"],"definition":"Intérêt résiduel dans les actifs après déduction des dettes ; ils comprennent notamment les apports, les réserves et le résultat conservé.","context":"Le RN augmente les capitaux propres s’il est positif ; les pertes et les dividendes les réduisent, à périmètre constant.","example":"Capitaux propres d’ouverture 300 + bénéfice 40 − dividendes 10 = clôture 330 k€ hors autres mouvements.","misconception":"Ce n’est ni une dette bancaire, ni une réserve de cash, ni automatiquement la valeur de marché des actions.","related":["passif","resultat-net","dividende"]},{"id":"tresorerie","label":"Trésorerie","acronym":"","aliases":["cash","disponibilités","argent disponible","Cash and cash equivalents"],"definition":"Ressources monétaires disponibles immédiatement, selon le périmètre retenu.","context":"Dans ces cas sans découvert ni placement assimilé, la trésorerie correspond aux disponibilités au bilan.","example":"La banque passe de 100 à 80 k€ : la variation de trésorerie est −20 k€.","misconception":"Un résultat positif ou un actif élevé ne garantit pas une trésorerie suffisante pour payer les échéances.","related":["solde-bancaire","tableau-flux","encaissement"]},{"id":"solde-bancaire","label":"Solde bancaire","acronym":"","aliases":["soldes bancaires"],"definition":"Montant figurant sur un compte bancaire à un instant, après les opérations enregistrées.","context":"Il renseigne sur un compte particulier ; la trésorerie de l’entreprise peut comprendre plusieurs comptes et d’autres éléments selon sa définition.","example":"Compte A : +20 k€ et compte B : +5 k€ ; il faut considérer les deux pour mesurer les fonds en banque.","misconception":"L’EBE, la marge et le résultat net ne sont pas des soldes bancaires.","related":["tresorerie","ebe","resultat-net"]},{"id":"encaissement","label":"Encaissement","acronym":"","aliases":["encaissements"],"definition":"Entrée effective d’argent dans la trésorerie de l’entreprise.","context":"Il peut venir d’un client, d’un emprunt, d’un apport ou d’une cession : sa nature doit être identifiée.","example":"Le paiement en janvier d’une vente de décembre crée un encaissement de janvier sans nouvelle vente en janvier.","misconception":"Un encaissement n’est pas toujours un produit ou un bénéfice.","related":["decaissement","creance-client","emprunt"]},{"id":"decaissement","label":"Décaissement","acronym":"","aliases":["décaissements"],"definition":"Sortie effective d’argent de la trésorerie de l’entreprise.","context":"Elle peut régler une charge, financer une immobilisation, rembourser une dette ou verser un dividende.","example":"Payer une machine 80 k€ est un décaissement d’investissement, même si l’amortissement annuel est de 16 k€.","misconception":"Tout décaissement n’est pas une charge de l’exercice.","related":["encaissement","capex","amortissement"]},{"id":"bfr","label":"Besoin en fonds de roulement","acronym":"BFR","aliases":[],"definition":"Montant de ressources immobilisées dans le cycle d’exploitation après les financements spontanés fournis par les dettes liées à ce cycle.","context":"Dans ces cas : stocks + créances clients − dettes fournisseurs − dettes fiscales et sociales. Sa variation intervient dans le passage du résultat au flux d’exploitation.","example":"Une hausse de 20 k€ des créances sans autre changement augmente le BFR de 20 et absorbe 20 de cash.","misconception":"Une hausse du BFR n’est pas une nouvelle charge : c’est un besoin de financement du cycle.","related":["stock","creance-client","flux-exploitation"]},{"id":"flux-exploitation","label":"Flux de trésorerie d’exploitation","acronym":"CFO","aliases":["flux d’exploitation","flux opérationnel","CFO","Net cash provided by operating activities"],"definition":"CFO signifie Cash Flow from Operations. Encaissements moins décaissements liés à l’activité d’exploitation, selon le classement choisi.","context":"Dans les cas simplifiés : RN + amortissements − variation du BFR. Intérêts et impôt sont ici classés en exploitation.","example":"RN 30 + amortissements 20 − hausse du BFR 40 = flux d’exploitation 10 k€.","misconception":"Il peut être négatif avec un bénéfice positif ; l’EBE n’est pas ce flux.","related":["tableau-flux","bfr","resultat-net"]},{"id":"flux-investissement","label":"Flux de trésorerie d’investissement","acronym":"CFI","aliases":["flux d’investissement","CFI"],"definition":"CFI signifie Cash Flow from Investing. Entrées et sorties d’argent relatives notamment aux acquisitions et cessions d’actifs durables.","context":"Dans les cas sans cession : flux d’investissement = − acquisitions d’immobilisations payées.","example":"Une machine payée 100 k€ crée un flux d’investissement de −100 k€.","misconception":"Un flux d’investissement négatif ne prouve pas une mauvaise performance : il peut financer des capacités futures.","related":["capex","immobilisation","tableau-flux"]},{"id":"flux-financement","label":"Flux de trésorerie de financement","acronym":"CFF","aliases":["flux de financement","CFF"],"definition":"CFF signifie Cash Flow from Financing. Entrées et sorties d’argent liées aux apports de capitaux, aux emprunts, à leur remboursement et aux distributions, selon le classement retenu.","context":"Dans ces cas : nouveaux emprunts − remboursements en capital − dividendes, sans autres mouvements.","example":"Emprunts reçus 80 − capital remboursé 30 − dividendes 10 = +40 k€.","misconception":"Ce flux peut augmenter le cash sans améliorer la rentabilité de l’activité.","related":["emprunt","dividende","tableau-flux"]},{"id":"capex","label":"Dépenses d’investissement","acronym":"CAPEX","aliases":["capex"],"definition":"CAPEX signifie Capital Expenditures : dépenses consacrées à l’acquisition ou au développement d’actifs durables ; le périmètre exact doit être précisé.","context":"Dans les cas proposés, il s’agit des acquisitions d’immobilisations payées pendant l’exercice.","example":"Un nouveau matériel informatique payé 50 k€ pèse sur le cash d’investissement, puis sur le résultat via son amortissement.","misconception":"CAPEX et dotation aux amortissements ne sont pas deux noms pour le même montant.","related":["immobilisation","flux-investissement","amortissement"]},{"id":"dividende","label":"Dividende","acronym":"","aliases":["dividendes"],"definition":"Distribution aux associés ou actionnaires décidée selon les règles applicables.","context":"Son paiement diminue la trésorerie et les capitaux propres, sans constituer une charge du résultat de l’exercice.","example":"Un bénéfice de 50 k€ et un dividende de 20 augmentent les capitaux propres de 30 hors autres mouvements.","misconception":"Le dividende ne se déduit pas pour calculer le résultat net.","related":["capitaux-propres","flux-financement","resultat-net"]},{"id":"taux-variation","label":"Taux de variation","acronym":"","aliases":[],"definition":"Variation relative d’une valeur entre une période de départ et une période d’arrivée.","context":"Formule : (valeur N − valeur N-1) / valeur N-1 × 100, avec une base non nulle et une interprétation adaptée à son signe.","example":"Ventes de 100 à 120 : +20 %. De 120 à 100 : −16,67 %.","misconception":"On ne divise pas par la valeur d’arrivée. Une base nulle interdit le calcul usuel ; une base négative exige de privilégier une lecture en montants et en signes.","related":["pourcentage","point-pourcentage","ratio"]},{"id":"pourcentage","label":"Pourcentage","acronym":"","aliases":["pourcent"],"definition":"Expression d’un rapport pour une base de 100.","context":"Dans l’application, saisir 12,5 pour 12,5 %, et non 0,125 sauf indication contraire.","example":"Personnel 200 / CA 1 000 × 100 = 20 %, soit 20 euros de personnel pour 100 euros de ventes.","misconception":"Le symbole % ne suffit pas : il faut identifier numérateur, dénominateur et période.","related":["ratio","poids-charges","point-pourcentage"]},{"id":"point-pourcentage","label":"Point de pourcentage","acronym":"","aliases":["points de pourcentage"],"definition":"Unité qui exprime la différence entre deux taux exprimés en pourcentage.","context":"Elle distingue l’écart des taux de leur variation relative.","example":"Une marge de 20 % à 25 % augmente de 5 points, soit une hausse relative de 25 %.","misconception":"Dire « +5 % » pour passer de 20 % à 25 % est ambigu et ne remplace pas « +5 points ».","related":["pourcentage","taux-variation","marge-sur-ventes"]},{"id":"ratio","label":"Ratio","acronym":"","aliases":["ratios"],"definition":"Rapport entre deux grandeurs choisies pour répondre à une question économique précise.","context":"Toujours préciser formule, période, unité et dénominateur. Comparer seulement des périmètres cohérents.","example":"RE / CA renseigne sur la part des ventes qui reste en résultat d’exploitation.","misconception":"Un ratio isolé n’établit ni la cause d’un problème ni un seuil universel de bonne santé.","related":["marge-exploitation","marge-nette","poids-charges"]},{"id":"marge-sur-ventes","label":"Marge commerciale rapportée aux ventes","acronym":"","aliases":["taux de marque","marge sur ventes"],"definition":"Rapport entre marge commerciale et ventes de marchandises, multiplié par 100.","context":"Il mesure la marge commerciale conservée pour 100 euros de ventes de marchandises. Dans cette application, cette formule est toujours explicitée.","example":"Marge 40 / ventes de marchandises 200 = 20 %.","misconception":"Ne pas confondre avec marge / coût d’achat vendu, souvent nommé taux de marge dans le commerce ; ne pas utiliser le CA total d’une activité mixte sans le dire.","related":["marge-commerciale","pourcentage","ratio"]},{"id":"marge-exploitation","label":"Marge d’exploitation","acronym":"","aliases":["marge opérationnelle"],"definition":"Rapport entre le résultat d’exploitation et le chiffre d’affaires, multiplié par 100 dans le périmètre retenu.","context":"Il mesure le résultat d’exploitation pour 100 euros de ventes, après amortissements, avant financement et impôt sur les bénéfices.","example":"RE 50 / CA 1 000 × 100 = 5 %.","misconception":"Une marge d’exploitation positive ne garantit pas une marge nette positive ni une trésorerie en hausse.","related":["resultat-exploitation","chiffre-affaires","marge-nette"]},{"id":"marge-nette","label":"Marge nette","acronym":"","aliases":[],"definition":"Rapport entre résultat net et chiffre d’affaires, multiplié par 100.","context":"Elle mesure le résultat final pour 100 euros de ventes, dans un périmètre comptable déterminé.","example":"RN −20 / CA 1 000 × 100 = −2 % : perte de 2 euros pour 100 euros de ventes.","misconception":"Elle n’est pas la marge commerciale et ne mesure pas directement le cash disponible.","related":["resultat-net","chiffre-affaires","ratio"]},{"id":"poids-charges","label":"Poids d’une charge dans les ventes","acronym":"","aliases":["poids des charges","poids du personnel"],"definition":"Rapport entre une charge identifiée et le chiffre d’affaires, multiplié par 100.","context":"Il aide à comparer le coût au niveau d’activité, en complément des montants et des données opérationnelles.","example":"Personnel 240 / CA 1 200 = 20 %. La part peut baisser même si la masse salariale augmente.","misconception":"Une baisse de ce poids ne prouve pas une amélioration sociale ou un sureffectif antérieur.","related":["personnel","charges-externes","pourcentage"]},{"id":"couverture-interets","label":"Poids des intérêts dans l’EBE","acronym":"","aliases":["intérêts sur EBE"],"definition":"Rapport intérêts / EBE × 100 lorsque l’EBE est strictement positif.","context":"Il indique quelle part de l’EBE représente la charge d’intérêts ; un rapport inverse EBE / intérêts serait un autre indicateur de couverture, en nombre de fois.","example":"Intérêts 10 / EBE 100 = 10 %. Si l’EBE est négatif, le quotient négatif ne traduit pas un financement confortable.","misconception":"Ne pas confondre intérêts / EBE et EBE / intérêts ; un dénominateur nul ou négatif appelle une alerte d’interprétation.","related":["interet","ebe","ratio"]},{"id":"resultat","label":"Résultat","acronym":"","aliases":["résultats","bénéfice","bénéfices","perte","pertes"],"definition":"Solde entre des produits et des charges sur un périmètre et une période définis. Positif, il s’agit d’un bénéfice ou excédent ; négatif, d’une perte ou insuffisance selon le solde.","context":"Le résultat peut être d’exploitation, financier, courant ou net : le mot seul ne précise pas l’étage. Toujours lire le qualificatif et la formule.","example":"Un résultat d’exploitation de +20 et un résultat financier de −30 donnent un résultat courant de −10, avant impôt dans ce cas.","misconception":"Tous les résultats ne sont pas le résultat net, et aucun résultat ne doit être assimilé automatiquement au solde bancaire.","related":["resultat-exploitation","resultat-financier","resultat-net"]},{"id":"financement","label":"Financement","acronym":"","aliases":["financements","financier"],"definition":"Moyens mobilisés pour financer les besoins de l’entreprise : capitaux apportés, bénéfices conservés, emprunts et financements du cycle d’exploitation.","context":"Une décision de financement change la structure des ressources. Son effet sur la trésorerie, la dette, les capitaux propres et les charges dépend de sa nature.","example":"Un emprunt encaissé apporte du cash et crée une dette ; ses intérêts futurs peuvent réduire le résultat.","misconception":"Le financement ne se confond pas avec le résultat financier : celui-ci porte sur les produits et charges financiers, pas sur tous les mouvements de dette ou de capital.","related":["emprunt","capitaux-propres","resultat-financier"]},{"id":"exploitation","label":"Exploitation","acronym":"","aliases":[],"definition":"Ensemble des opérations liées à l’activité courante par laquelle l’entreprise produit ou commercialise ses biens et services.","context":"Les ventes, consommations, salaires et amortissements de l’activité contribuent à son résultat d’exploitation. Les flux d’exploitation suivent les paiements liés à cette activité selon le classement retenu.","example":"Un magasin achète et vend des vêtements, paie ses équipes et loue son local dans le cadre de son exploitation.","misconception":"L’exploitation n’est pas synonyme de résultat d’exploitation : l’une est une activité, l’autre un solde comptable mesurant ses produits moins ses charges.","related":["resultat-exploitation","flux-exploitation","ebe"]},{"id":"produits-financiers","label":"Produits financiers","acronym":"","aliases":["produit financier"],"definition":"Revenus comptabilisés au titre de placements ou de certaines opérations financières, selon les règles du référentiel retenu.","context":"Ils sont ajoutés au résultat financier avant déduction des charges financières. Ils sont nuls dans les cas simplifiés de cette banque.","example":"Des intérêts acquis sur un placement de trésorerie peuvent constituer un produit financier.","misconception":"Recevoir le capital d’un emprunt n’est pas un produit financier : cela crée une dette, sans améliorer le résultat.","related":["produit","resultat-financier","emprunt"]},{"acronym":"","id":"service","label":"Service","aliases":["services","prestation de services"],"definition":"Activité fournie à un client : conseil, transport, abonnement, formation, réparation… Elle ne correspond pas à la revente en l’état d’une marchandise.","context":"Les ventes de services font partie du chiffre d’affaires, mais pas des ventes de marchandises utilisées pour la marge commerciale scolaire.","example":"Un salon facture une coupe ; un consultant facture une mission. Ils vendent des services.","misconception":"Toute vente n’est pas une vente de marchandises.","related":["vente","chiffre-affaires","marge-commerciale"]},{"acronym":"","id":"gross-profit","label":"Gross profit","aliases":["gross margin"],"definition":"Dans les comptes en anglais : revenus diminués des coûts classés dans le coût des ventes par l’entreprise. La traduction et le périmètre doivent être vérifiés.","context":"Un groupe de technologies peut inclure des coûts de fabrication, d’hébergement ou de services. Ce poste ne correspond pas automatiquement à la marge commerciale des SIG français.","example":"Ne renomme pas le Revenue moins Cost of revenue de Meta « marge commerciale » sans analyser les activités et les coûts.","misconception":"Les mots marge brute, gross profit et marge commerciale ne sont pas interchangeables sans définition.","related":["marge-commerciale","charge"]},{"acronym":"United States Generally Accepted Accounting Principles","id":"us-gaap","label":"US GAAP","aliases":[],"definition":"Principes comptables généralement admis aux États-Unis. Référentiel utilisé ici par Meta et AMD pour établir leurs comptes consolidés.","context":"Le classement des postes et certains calculs diffèrent du plan comptable français et des IFRS.","example":"Un compte de résultat américain classe souvent les charges par fonction : recherche, commercialisation, administration.","misconception":"On ne reconstruit pas automatiquement tous les SIG français avec un compte de résultat US GAAP.","related":["compte-resultat","sig"]},{"acronym":"International Financial Reporting Standards","id":"ifrs","label":"IFRS","aliases":[],"definition":"Normes internationales d’information financière. Elles encadrent notamment les comptes consolidés des groupes cotés de l’Union européenne.","context":"Carrefour publie ici ses comptes consolidés en IFRS. La comparaison 2024 présentée en 2025 tient compte du périmètre des activités poursuivies selon IFRS 5.","example":"Le compte de résultat distingue les activités poursuivies des activités abandonnées.","misconception":"Un indicateur propre à un groupe n’est pas nécessairement un solde défini de manière identique chez ses concurrents.","related":["compte-resultat","bilan"]},{"acronym":"Earnings Before Interest, Taxes, Depreciation and Amortization","id":"ebitda","label":"EBITDA","aliases":[],"definition":"Indicateur de résultat avant intérêts, impôts et amortissements. Son calcul opérationnel exact doit être vérifié dans la publication de l’entreprise.","context":"L’EBITDA publié par Carrefour ne doit pas être renommé EBE sans vérifier et rapprocher leurs définitions.","example":"Un indicateur élevé avant amortissements ne garantit ni un bénéfice net ni une hausse de trésorerie.","misconception":"EBITDA et EBE ne sont pas toujours identiques.","related":["ebe","resultat-exploitation","tresorerie"]},{"acronym":"FCF · flux de trésorerie disponible","id":"free-cash-flow","label":"Free cash flow","aliases":["FCF","cash-flow libre"],"definition":"Indicateur de trésorerie disponible après certaines dépenses d’investissement. La définition précise varie selon les groupes et doit être lue avec le calcul publié.","context":"Meta soustrait aux flux d’exploitation les achats d’immobilisations et le principal des finance leases. Il s’agit d’un indicateur non-GAAP.","example":"Meta 2025 : 115 800 − 69 691 − 2 524 = 43 585 M$.","misconception":"Le FCF n’est pas le bénéfice net, ni la variation totale de trésorerie.","related":["capex","flux-exploitation","resultat-net"]},{"acronym":"","id":"finance-lease","label":"Finance lease","aliases":["finance leases"],"definition":"Location-financement selon le référentiel appliqué : un contrat de location dont les paiements comprennent notamment une part de remboursement du principal.","context":"Dans la définition de CAPEX et de FCF de Meta, les remboursements du principal de ces contrats sont explicitement pris en compte.","example":"2 524 M$ de principal de finance leases sont ajoutés aux 69 691 M$ d’achats d’immobilisations dans le CAPEX publié de Meta 2025.","misconception":"Ce poste ne s’ajoute pas indistinctement à tous les indicateurs d’investissement.","related":["capex","free-cash-flow"]},{"acronym":"","id":"activites-poursuivies","label":"Activités poursuivies","aliases":["activités abandonnées"],"definition":"Les activités poursuivies sont celles qui demeurent dans le périmètre analysé. Les activités abandonnées sont présentées séparément selon les règles du référentiel.","context":"Pour comparer un résultat et un flux, garde le même périmètre : total avec abandonnées ou activités poursuivies seules.","example":"AMD 2025 : CFO total 7 709 M$, mais CFO des activités poursuivies 6 493 M$.","misconception":"Deux montants de la même année ne sont pas forcément comparables si leurs périmètres diffèrent.","related":["flux-exploitation","resultat-net"]},{"id":"couts-consommes","label":"Coûts consommés","aliases":[],"definition":"Coût des marchandises vendues et des matières utilisées pendant la période, selon l’activité de l’entreprise.","context":"Dans ces exercices, le montant donné tient déjà compte du stock initial et du stock final.","example":"Avec 20 k€ en stock au départ, 100 k€ d’achats et 30 k€ en stock à la fin, le coût consommé est de 90 k€.","misconception":"Les achats de la période peuvent inclure des marchandises qui restent en stock.","related":[]},{"id":"dettes-fiscales-sociales","label":"Dettes fiscales et sociales","aliases":[],"definition":"Sommes dues à l’administration fiscale ou aux organismes sociaux et encore à régler à la date du bilan.","context":"Elles figurent au passif. La variation d’une période à l’autre peut servir à calculer le flux d’exploitation, selon le périmètre retenu.","example":"Une entreprise a comptabilisé des cotisations sociales en novembre et les paie en décembre. Entre les deux dates, elle a une dette sociale.","misconception":"Une dette est un montant restant à payer à une date donnée. Une charge concerne une période.","related":[]},{"id":"variation-stocks-flux","label":"Effet de la variation des stocks","aliases":[],"definition":"Ajustement lié à la différence entre le stock de clôture et le stock d’ouverture.","context":"Dans le calcul présenté ici, on retranche une hausse des stocks et on ajoute une baisse.","example":"Une hausse des stocks de 30 k€ donne un ajustement de −30 k€.","misconception":"Cet ajustement se déduit des deux bilans. Il ne mesure pas directement les paiements aux fournisseurs.","related":[]},{"id":"variation-creances-flux","label":"Effet de la variation des créances","aliases":["Effet de la variation des créances clients"],"definition":"Ajustement lié au changement du montant que les clients doivent à l’entreprise.","context":"On retranche une hausse des créances dans le passage du résultat au flux d’exploitation, car davantage de ventes restent à encaisser.","example":"Des créances passant de 140 à 220 k€ donnent un ajustement de −80 k€.","misconception":"Une vente à crédit peut contribuer au résultat avant son encaissement.","related":[]},{"id":"variation-fournisseurs-flux","label":"Effet de la variation des dettes fournisseurs","aliases":["Effet de la variation fournisseurs"],"definition":"Ajustement lié au changement du montant que l’entreprise doit à ses fournisseurs.","context":"On ajoute une hausse des dettes fournisseurs dans le passage du résultat au flux d’exploitation, car davantage d’achats restent à payer.","example":"Des dettes passant de 90 à 125 k€ donnent un ajustement de +35 k€.","misconception":"Un signe positif peut correspondre à un paiement différé.","related":[]},{"id":"variation-dfs-flux","label":"Effet de la variation des dettes fiscales et sociales","aliases":[],"definition":"Ajustement lié au changement des sommes fiscales et sociales restant à régler.","context":"Dans les cas simplifiés présentés ici, on ajoute une hausse de ces dettes dans le calcul du flux d’exploitation.","example":"Des dettes passant de 10 à 16 k€ donnent un ajustement de +6 k€.","misconception":"Un signe positif indique ici une hausse des sommes restant à régler.","related":[]}]};

<script>
'use strict';

window.S4.numeric = (() => {
  const suffixes = {
    '%':['%'], points:['point','points','pt','pts','point de pourcentage','points de pourcentage','pp'],
    '×':['×','x','fois'], jours:['j','jour','jours'], 'k€':['k€','k €','keur'], 'M€':['m€','m €','meur']
  };
  function parse(raw,unit) {
    const input=raw.trim().toLowerCase().replaceAll('−','-').replace(/[\u00a0\u202f]/g,' ');
    if(!input) return {error:'Saisissez une valeur.'};
    const match=input.match(/^([+-]?(?:\d{1,3}(?: \d{3})+|\d+)(?:[,.]\d+)?|[+-]?[,.]\d+)(?:\s*(.*))$/u);
    if(!match) return {error:'Utilisez une valeur numérique avec une virgule ou un point décimal.'};
    const suffix=match[2].trim();
    if(suffix && !suffixes[unit]?.includes(suffix)) return {error:'L’unité saisie ne correspond pas à l’unité demandée.'};
    const value=Number(match[1].replaceAll(' ','').replace(',','.'));
    return Number.isFinite(value)?{value}:{error:'Saisissez un nombre fini.'};
  }
  function round(value,precision) {
    const scale=10**precision;
    const absolute=Math.abs(value)*scale;
    return Math.sign(value)*Math.floor(absolute+0.5+Number.EPSILON*Math.max(1,absolute)*4)/scale;
  }
  function precision(unit) { return unit==='×'?2:1; }
  function matches(input,expected,unit) {
    const places=precision(unit);
    const tolerance=0.5/10**places;
    const epsilon=Number.EPSILON*Math.max(1,Math.abs(expected))*8;
    return Math.abs(input-expected)<tolerance-epsilon || Math.abs(input-round(expected,places))<epsilon;
  }
  return {parse,round,precision,matches};
})();

</script>

    </section></div>

    <label for="interpret">Interprétez le résultat ou expliquez la donnée manquante</label><textarea required id="interpret" rows="3" data-case-field="interpret">${esc(s.interpret)}</textarea><div class="actions"><button class="primary">Vérifier la réponse</button></div></form>

    ${(review.unlocked||review.tries>=3)&&transfer?`<section class="panel" id="case-transfer"><h3>Micro-transfert · ${esc(transfer.name)}</h3>${table(transfer.rows)}<p>Appliquez le même indicateur aux nouvelles données.</p>
    <form data-form="case-transfer" data-id="${c.id}">${numericField(review.transfer,opt.unit,'case-transfer-number')}<div class="actions"><button>Vérifier le micro-transfert</button></div></form>
    ${review.transferMessage?feedback(review.transferCorrect?'':'bad',`<strong>${esc(review.transferMessage)}</strong><p>${review.transferCorrect||review.transferTries>=3?lex(transfer.expression+' = '+format(numeric.round(transfer.value,numeric.precision(opt.unit)))+' '+opt.unit+'. '+transfer.reading):lex(c.hints[Math.min((review.transferTries||1)-1,1)])}</p>${courseLink(opt.id)}`):''}
    ${consolidated?'<p><strong>Cas et transfert réussis.</strong></p>':''}${c.id==='lisiere'&&(review.transferCorrect||review.transferTries>=3)?`<div class="actions">${anchor('cours/3','Revenir au diagnostic et au bilan final',true)}</div>`:''}</section>`:''}
    </section>`:''}<div class="actions section-space">${needsTransfer?'<p>Vérifiez le micro-transfert pour passer à la situation suivante depuis ce cas.</p>':anchor('atelier/'+next.id,'Autre situation · '+next.name)}</div>`;

  function lexicon() {

  function lexList(value='') {
    const list=terms.filter(t=>normalize([t.label,t.acronym,...(t.aliases||[])].join(' ')).includes(normalize(value))).sort((a,b)=>a.label.localeCompare(b.label,'fr'));

    document.querySelector('#lex-list').innerHTML=list.map(t=>btn(t.label,'term',t.id)).join('');

  function setRoute() {
    const [page,id]=(location.hash.slice(1)||'accueil').split('/');
    route={page,id,phase:Math.max(0,Math.min(3,Number(id)||0)),c:cases.find(c=>c.id===id)};
  }
  function render(focusSelector,scroll=false) {
    if(dialog.open) dialog.close();
    document.querySelectorAll('nav a').forEach(a=>a.getAttribute('href')==='#'+route.page?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
    const pages={accueil:home,cours:()=>course(route.phase),explorateur:atlas,atelier:()=>workshop(route.c),quiz:quizPage,lexique:lexicon};
    main.innerHTML=(pages[route.page]||home)();
    if(route.page==='lexique') lexList();

    if(focusSelector) main.querySelector(focusSelector)?.focus({preventScroll:true});

  window.addEventListener('hashchange',()=>{if(location.hash==='#main'){main.focus();return;}setRoute();render('h1',true);});
  document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();});

  function openHelp(title,body,trigger) {
    if(dialog.open) frames.push({title:dialogTitle.textContent,html:dialogContent.innerHTML,triggerIndex:[...dialogContent.querySelectorAll('button,a')].indexOf(trigger),scroll:dialog.scrollTop});
    else frames=[{trigger}];
    dialogTitle.textContent=title;
    dialogContent.innerHTML=body;
    if(!dialog.open) dialog.showModal();
    dialog.scrollTop=0;
    closeHelp.focus();
  }
  function popHelp() {
    if(frames.length===1) { dialog.close(); return; }
    const p=frames.pop();
    dialogTitle.textContent=p.title;
    dialogContent.innerHTML=p.html;
    const trigger=dialogContent.querySelectorAll('button,a')[p.triggerIndex];
    (trigger||closeHelp).focus({preventScroll:true});
    dialog.scrollTop=p.scroll;
  }
  dialog.addEventListener('cancel',e=>{e.preventDefault();popHelp();});
  dialog.addEventListener('close',()=>{frames[0]?.trigger?.focus({preventScroll:true});frames=[];});
  closeHelp.addEventListener('click',popHelp);

  function toggleOptions(open) {
    const toggle=document.querySelector('#ratio-toggle');
    const options=document.querySelector('#ratio-options');
    if(!toggle||!options) return;
    toggle.setAttribute('aria-expanded',String(open));
    options.hidden=!open;
    if(!open) document.querySelector('#ratio-preview').hidden=true;
  }
  function showPreview(id) {
    const box=document.querySelector('#ratio-preview');
    if(!box) return;
    const r=catalogue[id];
    box.hidden=false;
    box.innerHTML=`<h3>Aperçu · ${esc(r.name)}</h3><p>${lex(r.formula)}</p><p>${lex(r.meaning)}</p><p>${lex(r.question)}</p><p>${lex(r.reading)}</p><p><b>Limite</b> ${lex(r.limit)}</p><div class="actions">${btn('Voir la fiche','fact',id)}${btn('Fermer l’aperçu','preview-close')}</div>`;
  }
  main.addEventListener('pointerover',e=>{const b=e.target.closest('[data-do="ratio"]');if(b&&e.pointerType==='mouse') showPreview(b.dataset.id);});
  main.addEventListener('focusin',e=>{const b=e.target.closest('[data-do="ratio"]');if(b) showPreview(b.dataset.id);});
  main.addEventListener('keydown',e=>{
    if(e.target.id==='ratio-toggle'&&['ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault();toggleOptions(true);document.querySelector('#ratio-options button')?.focus();return;
    }
    const b=e.target.closest('#ratio-options button');
    if(e.key==='Escape'&&(b||e.target.closest('#ratio-preview')||e.target.id==='ratio-toggle')){
      e.preventDefault();toggleOptions(false);document.querySelector('#ratio-toggle')?.focus();return;
    }
    if(!b||!['ArrowDown','ArrowUp','Home','End'].includes(e.key)) return;
    e.preventDefault();
    const items=[...document.querySelectorAll('#ratio-options button')];
    const i=items.indexOf(b);
    const next=e.key==='Home'?0:e.key==='End'?items.length-1:e.key==='ArrowDown'?Math.min(i+1,items.length-1):Math.max(i-1,0);
    items[next].focus();
  });

  document.addEventListener('click',e=>{
    const target=e.target.closest('button');
    if(!target) return;
    if(target.id==='ratio-toggle'){
      const open=target.getAttribute('aria-expanded')==='false';
      toggleOptions(open);
      if(open&&e.detail===0) document.querySelector('#ratio-options button')?.focus();
      return;
    }
    const {do:action,id}=target.dataset;
    if(action==='term'){
      const t=termById[id];
      openHelp(t.label,`<p>${esc(t.definition)}</p><p><b>Exemple</b> ${esc(t.example||t.context)}</p>${t.context&&t.example?`<p>${esc(t.context)}</p>`:''}${t.misconception?`<p>${esc(t.misconception)}</p>`:''}`,target);
    }
    if(action==='fact') openHelp(catalogue[id].name,fact(catalogue[id]),target);
    if(action==='formulas') openHelp('Formules du socle DST',window.S4.socle.map(id=>`<h3>${esc(catalogue[id].name)}</h3><p class="formula">${lex(catalogue[id].formula)}</p>${btn('Voir la fiche : '+catalogue[id].name,'fact',id)}`).join(''),target);
    if(action==='preview-close'){toggleOptions(false);document.querySelector('#ratio-toggle').focus();}
    if(action==='filter'){explorer.group=id;render(`[data-do="filter"][data-id="${id}"]`);}
    if(action==='explore'){
      explorer.id=id;
      const r=catalogue[id];
      main.querySelectorAll('[data-do="explore"]').forEach(b=>b.setAttribute('aria-pressed',String(b===target)));
      main.querySelector('#explorer-fact').innerHTML=`<h2 tabindex="-1">${esc(r.name)}</h2>${fact(r)}`;
      main.querySelector('#explorer-fact h2').focus();
    }
    if(action==='ratio'){
      const s=state.cases[route.c.id];
      if(s.ratio!==id){s.ratio=id;delete s.selection;}
      save();render('#ratio-toggle');
    }
    if(action==='check-choice'){
      const c=route.c,s=state.cases[c.id];
      const correct=c.options.some(o=>o.id===s.ratio&&o.group===s.family);
      if(!correct) s.choiceTries=(s.choiceTries||0)+1;
      s.selection=correct?'yes':'no';
      save();render(correct?'#why':'#check-choice');
      if(correct) main.querySelector('#case-answer').scrollIntoView({block:'nearest'});
    }
  });

  main.addEventListener('change',e=>{
    if(e.target.id==='family') {
      const s=state.cases[route.c.id];
      s.family=e.target.value;
      if(!catalogue[s.ratio]?.groups.includes(s.family)) delete s.ratio;
      delete s.selection;
      save();render('#family');
    }
    if(e.target.id==='diagnostic-reviewed'){state.diagnosticReviewed=e.target.checked;save();}
    if(e.target.form?.dataset.form==='reading'){state.reading=e.target.value;delete state.readingChecked;save();e.target.form.querySelector('.feedback')?.remove();}
    if(e.target.form?.dataset.form==='quiz'){
      const id=e.target.form.dataset.id;
      const s=state.quiz[id]||={};
      s.selection=Number(e.target.value);
      save();
    }
  });
  main.addEventListener('input',e=>{
    const el=e.target;
    if(el.id==='lex-search'){lexList(el.value);return;}
    if(el.dataset.store){
      state[el.dataset.store]=el.value;
      delete state.diagnosticMessage;
      el.form.querySelector('.feedback')?.remove();
      save();
      return;
    }
    const form=el.form;
    if(!form) return;
    const {form:kind,id}=form.dataset;
    if(kind==='practice'||kind==='transfer'){
      const s=state.practice[id]||={};
      s[kind==='practice'?'answer':'transfer']=el.value;
      delete s[kind==='practice'?'correct':'transferCorrect'];
      delete s[kind==='practice'?'message':'transferMessage'];
      form.nextElementSibling?.matches('.feedback[role=status]')&&form.nextElementSibling.remove();
      save();
    }
    if(kind==='case'||kind==='case-transfer'){
      const s=state.cases[id];
      const review=(s.reviews||={})[s.ratio]||={};
      if(kind==='case-transfer'){review.transfer=el.value;delete review.transferCorrect;delete review.transferMessage;}
      else if(el.dataset.caseField==='feasible') review.feasible=el.value;
      else if(el.id==='case-number') review.answer=el.value;
      else if(el.dataset.caseField) s[el.dataset.caseField]=el.value;
      if(kind==='case'){delete review.correct;delete review.message;}
      form.nextElementSibling?.matches('.feedback[role=status]')&&form.nextElementSibling.remove();
      save();
    }
  });

  function assess(input,expected,unit,s,fields,key) {
    const result=numeric.parse(input||'',unit);
    if(result.error) {
      s[fields.message]=result.error;
      s[fields.correct]=false;
      return;
    }
    const correct=numeric.matches(result.value,expected,unit);
    s[fields.message]=correct?'Calcul juste.':'Calcul à revoir.';
    s[fields.correct]=correct;
    if(correct) state.points[key]=true;
    else s[fields.tries]=(s[fields.tries]||0)+1;
  }
  main.addEventListener('submit',e=>{
    e.preventDefault();
    const {form:kind,id}=e.target.dataset;
    const before=completedPhases().filter(Boolean).length;
    if(kind==='diagnostic'){
      if(state.diagnostic?.trim()&&state.diagnosticReviewed) {
        state.completedActivities.diagnostic=true;
        state.diagnosticMessage='Diagnostic autoévalué.';
      } else state.diagnosticMessage='Rédigez votre diagnostic et comparez-le à la grille.';
    }
    if(kind==='reading'){state.readingChecked=state.reading;if(state.reading==='sales-cost') state.points.reading=true;}
    if(kind==='quiz'){
      const s=state.quiz[id];
      if(s?.selection!==undefined) s.checked=s.selection;
    }
    if(kind==='practice'||kind==='transfer'){
      const p=practice.find(p=>p.id===id);
      const s=state.practice[id]||={};
      if(kind==='practice') assess(s.answer,p.value,p.unit,s,{message:'message',correct:'correct',tries:'tries'},'practice-'+id);
      else assess(s.transfer,p.transfer.value,p.unit,s,{message:'transferMessage',correct:'transferCorrect',tries:'transferTries'},'transfer-'+id);
      if(s.correct) s.unlocked=true;
    }
    if(kind==='case'||kind==='case-transfer'){
      const c=route.c;
      const s=state.cases[id];
      const o=c.options.find(o=>o.id===s.ratio&&o.group===s.family);
      if(!o||s.selection!=='yes') return;
      const review=(s.reviews||={})[s.ratio]||={};
      if(kind==='case-transfer'){
        const transfer=caseTransfers[o.id];
        assess(review.transfer,transfer.value,o.unit,review,{message:'transferMessage',correct:'transferCorrect',tries:'transferTries'},'case-transfer-'+id);
      } else if(!s.why?.trim()||!s.interpret?.trim()){
        review.message='Rédigez une justification et une interprétation pour les comparer à la grille.';
        review.correct=false;
      } else if(o.value===null) {
        review.correct=review.feasible==='no';
        review.message=review.correct?'La limite de calcul est bien identifiée.':'Vérifiez les données et la base du rapport.';
        if(review.correct) state.points['case-'+id]=true;
        else review.tries=(review.tries||0)+1;
      } else assess(review.answer,o.value,o.unit,review,{message:'message',correct:'correct',tries:'tries'},'case-'+id);
      if(review.correct) review.unlocked=true;
    }
    rememberCompletedActivities();
    save();
    render(`[data-form="${kind}"][data-id="${id}"] button[type="submit"], [data-form="${kind}"][data-id="${id}"] button:last-child`);
    const after=completedPhases().filter(Boolean).length;
    if(after!==before) document.querySelector('#progress-announcement').textContent=`Progression dans l’application. ${after*25} %, ${after} étapes terminées sur 4.`;
  });

  rememberCompletedActivities();
  setRoute();
  render();
})();

</script>
</body></html>
